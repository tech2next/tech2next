<div class="bd-fab-wrap">
  <button class="bd-fab sprint" id="bd-open-sprint">🏁 Sprint</button>
</div>

<!-- Sprint modal -->
<div class="bd-overlay bd-hidden" id="bd-sprint-overlay">
  <div class="bd-card bd-cardwrap" id="bd-sprint-card"></div>
</div>

<script>
(function(){
  "use strict";
  var PROGRESS_KEY = "brickdash-progress-v1";

  function loadProgress(){
    try { return JSON.parse(window.localStorage.getItem(PROGRESS_KEY) || "{}") || {}; }
    catch(e){ return {}; }
  }
  function saveProgress(p){
    try { window.localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); } catch(e){}
  }
  function fmtTime(sec){
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec/60), s = sec%60;
    return m + ":" + String(s).padStart(2,"0");
  }

  /* ============== SPRINT MATH ============== */
  var sprintOverlay = document.getElementById("bd-sprint-overlay");
  var sprintCard = document.getElementById("bd-sprint-card");
  document.getElementById("bd-open-sprint").addEventListener("click", function(){
    sprintOverlay.classList.remove("bd-hidden");
    renderSprintSetup();
  });

  var sprintState = { op:"+", n:7, count:44, target:120 };

  function sprintKey(){ return "sprint_" + (sprintState.op==="+"?"add":sprintState.op==="\u2212"?"sub":"mul") + "_" + sprintState.n + "_" + sprintState.count; }

  function renderSprintSetup(){
    var p = loadProgress();
    var best = (p.sprints && p.sprints[sprintKey()] && p.sprints[sprintKey()].bestSec) || null;
    sprintCard.innerHTML =
      '<button class="bd-close" id="bd-sprint-x">✕</button>' +
      '<h1>🏁 Sprint Math</h1>' +
      '<p style="margin:0 0 10px;color:#5B6B87;">Worksheet-style speed drill \u2014 same idea as a paper timed sprint. Try to beat 2:00!</p>' +
      '<h2>Operation</h2>' +
      '<div class="bd-row" id="bd-op-row"></div>' +
      '<h2>Number</h2>' +
      '<div class="bd-row"><input type="number" min="1" max="12" class="bd-num" id="bd-n-input" value="'+sprintState.n+'"></div>' +
      '<h2>How many problems?</h2>' +
      '<div class="bd-row" id="bd-count-row"></div>' +
      '<p style="color:#5B6B87;margin:6px 0 4px;">'+(best!==null ? ("Best time so far: <b>"+fmtTime(best)+"</b>") : "No runs yet at this setup.")+'</p>' +
      '<div class="bd-row" style="margin-top:16px;"><button class="bd-btn gold" id="bd-sprint-start">Start the clock \u23F1</button></div>';

    document.getElementById("bd-sprint-x").onclick = function(){ sprintOverlay.classList.add("bd-hidden"); };

    var ops = [["+","Add"],["\u2212","Subtract"],["\u00d7","Multiply"]];
    var opRow = document.getElementById("bd-op-row");
    ops.forEach(function(o){
      var b = document.createElement("button");
      b.className = "bd-chip" + (sprintState.op===o[0] ? " on" : "");
      b.textContent = o[0] + " " + o[1];
      b.onclick = function(){ sprintState.op = o[0]; renderSprintSetup(); };
      opRow.appendChild(b);
    });

    var counts = [22,44,60];
    var countRow = document.getElementById("bd-count-row");
    counts.forEach(function(c){
      var b = document.createElement("button");
      b.className = "bd-chip" + (sprintState.count===c ? " on" : "");
      b.textContent = c + " problems";
      b.onclick = function(){ sprintState.count = c; renderSprintSetup(); };
      countRow.appendChild(b);
    });

    document.getElementById("bd-n-input").oninput = function(e){
      var v = parseInt(e.target.value,10);
      if(!isNaN(v) && v>=1 && v<=12) sprintState.n = v;
    };

    document.getElementById("bd-sprint-start").onclick = function(){
      var v = parseInt(document.getElementById("bd-n-input").value,10);
      if(!isNaN(v) && v>=1 && v<=12) sprintState.n = v;
      startSprintRun();
    };
  }

  function genSprintProblems(op, n, count){
    var probs = [];
    for(var i=0;i<count;i++){
      var x = i<8 ? i : Math.floor(Math.random()*90)+10;
      var a,b,ans;
      if(op==="+"){
        if(i%2===0){ a=x; b=n; } else { a=n; b=x; }
        ans = a+b;
      } else if(op==="\u2212"){
        var big = Math.max(x,n), small = Math.min(x,n);
        if(big===small) big = big + n;
        a = big; b = small; ans = a-b;
      } else {
        if(i%2===0){ a=x; b=n; } else { a=n; b=x; }
        ans = a*b;
      }
      probs.push({a:a,b:b,op:op,ans:ans});
    }
    return probs;
  }

  function startSprintRun(){
    var probs = genSprintProblems(sprintState.op, sprintState.n, sprintState.count);
    var idx = 0, correct = 0, startTime = Date.now(), timerId = null, finished = false;

    function render(){
      var elapsed = (Date.now()-startTime)/1000;
      sprintCard.innerHTML =
        '<div class="bd-sprint-top"><span class="bd-progress" style="margin:0;">Problem '+(idx+1)+' of '+probs.length+'</span>' +
        '<span class="bd-timer" id="bd-run-timer">\u23F1 '+fmtTime(elapsed)+'</span></div>' +
        '<div class="bd-problem"><div class="expr">'+probs[idx].a+' '+probs[idx].op+' '+probs[idx].b+' = ?</div></div>' +
        '<div class="bd-answerbox"><input class="bd-input" id="bd-run-input" type="number" autofocus></div>' +
        '<div class="bd-row" style="justify-content:center;"><button class="bd-btn ghost" id="bd-run-stop">Stop</button></div>';

      var input = document.getElementById("bd-run-input");
      input.focus();
      function submit(){
        var v = input.value;
        if(v==="") return;
        var isRight = Number(v) === probs[idx].ans;
        input.classList.add(isRight ? "ok" : "no");
        if(isRight) correct++;
        setTimeout(function(){
          idx++;
          if(idx>=probs.length){ finishSprint(); } else { render(); }
        }, 220);
      }
      input.addEventListener("keydown", function(e){ if(e.key==="Enter") submit(); });
      document.getElementById("bd-run-stop").onclick = function(){ finishSprint(); };
    }

    timerId = setInterval(function(){
      var el = document.getElementById("bd-run-timer");
      if(el && !finished) el.textContent = "\u23F1 " + fmtTime((Date.now()-startTime)/1000);
    }, 500);

    function finishSprint(){
      finished = true;
      clearInterval(timerId);
      var totalSec = (Date.now()-startTime)/1000;
      var p = loadProgress();
      p.sprints = p.sprints || {};
      var key = sprintKey();
      var prevBest = p.sprints[key] && p.sprints[key].bestSec;
      var isRecord = prevBest === undefined || totalSec < prevBest;
      if(isRecord){ p.sprints[key] = { bestSec: totalSec, count: probs.length, op: sprintState.op, n: sprintState.n }; }
      saveProgress(p);
      var underTarget = totalSec <= sprintState.target;
      sprintCard.innerHTML =
        '<div class="bd-results">' +
        '<div class="big">'+(underTarget?"\ud83c\udfc1":"\u26a1")+'</div>' +
        '<h1>'+fmtTime(totalSec)+'</h1>' +
        '<p style="color:#5B6B87;">'+correct+' of '+probs.length+' correct'+(isRecord?' \u2014 <b>new best time!</b>':'')+'</p>' +
        '<p style="color:#5B6B87;">'+(underTarget ? "Under 2:00 \u2014 that's a sprint!" : "Goal: under 2:00. Keep practicing to speed up.")+'</p>' +
        '<div class="bd-row" style="justify-content:center;margin-top:14px;">' +
        '<button class="bd-btn gold" id="bd-run-again">Run it again</button>' +
        '<button class="bd-btn ghost" id="bd-run-settings">Change settings</button>' +
        '<button class="bd-btn ghost" id="bd-run-close">Close</button>' +
        '</div></div>';
      document.getElementById("bd-run-again").onclick = startSprintRun;
      document.getElementById("bd-run-settings").onclick = renderSprintSetup;
      document.getElementById("bd-run-close").onclick = function(){ sprintOverlay.classList.add("bd-hidden"); };
    }

    render();
  }

})();
</script>

</body>
</html>
