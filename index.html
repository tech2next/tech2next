/* Fonts are embedded in the page as data URIs. No external requests. */

.tt * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
.tt {
  --caliche:#E9EFFA; --paper:#FFFFFF; --ink:#0F1F3D; --soft:#5B6B87;
  --bluebonnet:#1B62E8; --bluebonnet-lt:#DCE7FD;
  --juniper:#12A05A; --juniper-lt:#DAF3E6;
  --sunset:#F5C518; --sunset-lt:#FEF3CE;
  --clay:#D8362A; --clay-lt:#FBE0DE;
  --line:#CFDAEC;
  --display:'Cherry Cream Soda',ui-rounded,'Avenir Next Rounded',system-ui,cursive;
  --ui:'Playpen Sans',ui-rounded,'SF Pro Rounded',system-ui,sans-serif;
  --read:'Nunito',-apple-system,'Avenir Next',system-ui,sans-serif;
  font-family:var(--ui);
  color:var(--ink); background:var(--caliche);
  min-height:100vh; touch-action:manipulation;
  -webkit-text-size-adjust:100%;
}
.tt h1,.tt h2,.tt h3,.tt .display { font-family:var(--display); font-weight:400; letter-spacing:0; }

.shell { max-width:900px; margin:0 auto; padding:0 18px 96px; }

/* ---- top bar ---- */
.topbar { position:sticky; top:0; z-index:30; background:var(--caliche);
  border-bottom:2px solid var(--line); padding:12px 18px;
  display:flex; align-items:center; gap:12px; }
.topbar .home { font-family:var(--ui); font-size:19px; background:none; border:none;
  color:var(--ink); cursor:pointer; padding:6px 4px; }
.spacer { flex:1; }
.pill { display:inline-flex; align-items:center; gap:6px; font-weight:800; font-size:15px;
  padding:7px 13px; border-radius:999px; background:var(--paper); border:2px solid var(--line); }
.pill.gold { background:var(--sunset-lt); border-color:#EBCB92; }
.pill.timer { background:var(--bluebonnet-lt); border-color:#BFC6EE; font-variant-numeric:tabular-nums; }
.pill.timer.low { background:var(--clay-lt); border-color:#E3B3AA; color:var(--clay); }

/* ---- generic ---- */
.card { background:var(--paper); border:2px solid var(--line); border-radius:20px; padding:22px; }
.stack > * + * { margin-top:14px; }
.lede { font-size:18px; line-height:1.55; }
.small { font-size:14px; color:var(--soft); }
.btn { font-family:var(--ui); font-size:18px; font-weight:700; border:none; cursor:pointer;
  padding:16px 26px; border-radius:16px; background:var(--bluebonnet); color:#fff;
  min-height:56px; box-shadow:0 4px 0 #0E45AC; }
.btn:active { transform:translateY(3px); box-shadow:0 1px 0 #0E45AC; }
.btn.ghost { background:var(--paper); color:var(--ink); border:2px solid var(--line); box-shadow:0 4px 0 var(--line); }
.btn.ghost:active { transform:translateY(3px); box-shadow:0 1px 0 var(--line); }
.btn.gold { background:var(--sunset); color:#3A2A0C; box-shadow:0 4px 0 #C79E0C; }
.btn:disabled { opacity:.4; cursor:default; }
.btnrow { display:flex; gap:10px; flex-wrap:wrap; }

/* ---- trail map ---- */
.hero { padding:26px 4px 10px; }
.hero h1 { font-size:34px; line-height:1.05; margin:0 0 8px; }
.trail { display:grid; gap:14px; }
@media (min-width:640px){ .trail { grid-template-columns:1fr 1fr; } }
.region { text-align:left; background:var(--paper); border:2px solid var(--line);
  border-radius:22px; padding:18px; cursor:pointer; display:block; width:100%;
  border-left:10px solid var(--rc); position:relative; overflow:hidden;
  box-shadow:0 4px 0 var(--line); }
.region::after { content:""; position:absolute; top:14px; right:14px; width:58px; height:16px;
  background-image:radial-gradient(circle at 9px 8px, var(--rc) 6px, transparent 6px),
                   radial-gradient(circle at 29px 8px, var(--rc) 6px, transparent 6px),
                   radial-gradient(circle at 49px 8px, var(--rc) 6px, transparent 6px);
  opacity:.35; }
.region:active { transform:translateY(3px); box-shadow:0 1px 0 var(--line); }
.region h3 { font-size:22px; margin:0 0 4px; }
.region .meta { font-size:14px; color:var(--soft); font-weight:600; }
.bar { height:9px; background:var(--caliche); border-radius:99px; margin-top:12px; overflow:hidden; }
.bar i { display:block; height:100%; background:var(--rc); border-radius:99px; transition:width .5s; }

/* ---- concept list ---- */
.stop { display:flex; align-items:center; gap:14px; width:100%; text-align:left;
  background:var(--paper); border:2px solid var(--line); border-radius:18px;
  padding:16px; cursor:pointer; }
.stop:active { transform:translateY(2px); }
.stop .badge { width:44px; height:44px; border-radius:14px; flex:none;

`,Xv={perimeter:"The distance all the way around the outside of a shape. Like walking the fence around a yard.",area:"How much flat space is inside a shape. Measured in squares.",array:"Objects lined up in equal rows and columns, like an egg carton.",product:"The answer when you multiply.",factor:"A number you multiply. In 4 \xD7 5, both 4 and 5 are factors.",quotient:"The answer when you divide.",equivalent:"Different-looking but worth exactly the same amount.",numerator:"The top number of a fraction. It tells how many parts you have.",denominator:"The bottom number of a fraction. It tells how many equal parts the whole was cut into.","unit fraction":"A fraction with 1 on top, like 1/4. It is one single piece of the whole.","expanded form":"Writing a number as the VALUE of each digit added together, like 300 + 40 + 2. No multiplying shown.","expanded notation":"Writing each digit TIMES its place value, all added together, like (3 \xD7 100) + (4 \xD7 10) + (2 \xD7 1).","place value":"What a digit is worth because of where it sits in the number.",round:"Change a number to a nearby friendly number, like 10 or 100.",polygon:"A closed flat shape made only of straight sides.",quadrilateral:"Any flat shape with exactly 4 straight sides.",parallelogram:"A quadrilateral where both pairs of opposite sides are parallel.",trapezoid:"A quadrilateral with at least one pair of parallel sides.",rhombus:"A quadrilateral with 4 equal sides.",prism:"A solid shape with two matching flat ends and flat sides.",cylinder:"A solid shape like a can: two circle ends and a curved side.",cone:"A solid shape with one circle end that comes to a point.",sphere:"A perfectly round solid, like a ball.",face:"A flat surface on a solid shape.",attribute:"A feature of a shape, like number of sides or corners.",capacity:"How much liquid a container can hold.",volume:"The amount of space something takes up. Liquid volume means how much liquid.",interval:"The size of each step on a graph's scale, like counting by 5s.","frequency table":"A table that shows how many times each thing happened.","dot plot":"A graph that stacks one dot for each piece of data above a number line.",pictograph:"A graph that uses pictures, where one picture can stand for more than one thing.","bar graph":"A graph that uses bars. Taller bar means a bigger number.",scale:"The numbers on the side of a graph that tell what each step is worth.",income:"Money you earn from working.","human capital":"The skills and knowledge a person has that help them earn money.",credit:"Borrowing money now and paying it back later, usually with extra.",interest:"Extra money you pay for borrowing, or earn for saving.",scarcity:"When there is not enough of something for everyone who wants it.",inference:"A smart guess you make using clues in the text plus what you already know.",evidence:"The exact words in the text that prove your answer.",theme:"The lesson or big message of a story. Not the same as the topic.",topic:"What the story is about in one or two words.","central idea":"The most important point of an informational text.",claim:"What the author wants you to believe or do.",fact:"Something that can be proven true.",opinion:"What someone thinks or feels. It can't be proven.","author's purpose":"The reason the author wrote it: to inform, to persuade, or to entertain.",audience:"The people the author wrote it for.",stanza:"A group of lines in a poem, like a paragraph.","rhyme scheme":"The pattern of which lines rhyme in a poem.",conflict:"The problem the character has to face.",resolution:"How the problem gets solved at the end.",setting:"Where and when a story happens.","point of view":"Who is telling the story. 'I' means first person. 'He' or 'she' means third person.",simile:"Comparing two things using like or as. 'Quiet as a mouse.'",hyperbole:"A huge exaggeration that isn't meant to be believed. 'I'm starving to death.'",onomatopoeia:"A word that sounds like the noise it names, like buzz or splash.",imagery:"Words that make a picture in your head.",voice:"How the writing sounds, like the personality of the writer.",homophone:"Words that sound the same but mean different things, like their and there.",prefix:"Word part added to the front, like re- in reread.",suffix:"Word part added to the end, like -ful in helpful.","context clue":"Nearby words that help you figure out what a hard word means.",synonym:"A word that means about the same thing.",antonym:"A word that means the opposite.","compound sentence":"Two complete sentences joined by a comma and a word like and, but, or so.","subject-verb agreement":"The subject and verb have to match. One dog runs. Two dogs run.",tense:"When something happens: past, present, or future.",possessive:"Shows something belongs to someone, usually with an apostrophe.",adverb:"A word that tells how, when, or where something happened.",adjective:"A word that describes a noun.",preposition:"A little position word like under, before, or beside.",conjunction:"A joining word like and, but, or so."},YT=({children:t,onPick:e})=>(0,p.jsx)("span",{className:"vw",onClick:()=>e(String(t).toLowerCase()),role:"button",tabIndex:0,children:t});function Zn({text:t,onWord:e}){let n=String(t).split(/(\[\[[^\]]+\]\])/g);return(0,p.jsx)(p.Fragment,{children:n.map((i,r)=>i.startsWith("[[")?(0,p.jsx)(YT,{onPick:e,children:i.slice(2,-2)},r):(0,p.jsx)("span",{children:i},r))})}var ip={brick:{title:"The Last Gold Brick",body:["There was exactly one gold brick left in the whole set, and Milo had been saving it for the top of his tower. It had been his plan since Tuesday.","But Saturday morning, his little sister Rosa was already standing under the high shelf. Her hand was stretched up. Her fingers wiggled. She could not quite reach the bin.","Milo opened his mouth. Then he looked at her face, at how hard she was trying, at how she had sorted every loose piece into the right tray each morning without being asked.","He walked over, lifted her up by the waist, and said nothing at all.",'Rosa pulled out the gold brick. She turned it over twice, then held it out to him. "We build it together," she said. Their grandpa, watching from the doorway, smiled into his coffee.']},speed:{title:"Built for Speed",body:["The peregrine falcon is the fastest animal on Earth. When it folds its wings and dives, it can reach two hundred miles per hour \u2014 faster than a race car.","On the ground, the cheetah is king. It can sprint about seventy miles per hour, and it goes from standing still to full speed in three seconds.","But speed costs something. A cheetah can only run flat out for about thirty seconds before its body overheats and it has to stop. That is why a cheetah creeps close before it ever starts running.","In the ocean, the sailfish is the champion. It has a long pointed bill and a body shaped like a spear, which lets water slide past instead of pushing back."]},buildtime:{title:"Give Us Back Our Build Time",body:["Our school cut Friday build club from thirty minutes to fifteen. That change was a mistake, and it should be reversed.","Fifteen minutes is not enough to finish anything. By the time we get our trays out and plan a design, the timer goes off and everything has to be packed away half built.","Some adults think less build time means more learning time. I disagree. Building is where I actually use math \u2014 I measure, I count, I fix mistakes. Nobody makes me pay attention. I just do.","Build club is not wasted time. It is the part of the week that makes the rest of it worth showing up for. Please give us our thirty minutes back."]}},Qr=[{id:"num",name:"Brick Yard",sub:"Numbers & Fractions",subject:"Math",rc:"#1B62E8",icon:"\u{1F9F1}"},{id:"ops",name:"Gear Works",sub:"Adding, Multiplying, Dividing",subject:"Math",rc:"#12A05A",icon:"\u2699\uFE0F"},{id:"geo",name:"Build Deck",sub:"Shapes & Measuring",subject:"Math",rc:"#D8362A",icon:"\u{1F4D0}"},{id:"dat",name:"Score Tower",sub:"Graphs & Coins",subject:"Math",rc:"#F5C518",icon:"\u{1F3C6}"},{id:"read",name:"Story Mode",sub:"Reading & Understanding",subject:"Reading",rc:"#8B3FD6",icon:"\u{1F4D6}"},{id:"write",name:"Repair Bay",sub:"Fixing & Upgrading Writing",subject:"Reading",rc:"#0FA3B1",icon:"\u{1F527}"}],Li=[{id:"placevalue",region:"num",icon:"\u{1F522}",teks:"3.2A, 3.2B",title:"Place value and expanded form",idea:"Every digit has a job. Its job depends on where it sits. In 4,706 the 7 isn't just 'seven' \u2014 it is 7 hundreds, worth 700.",another:"Think of it like money. A 5 in the thousands spot is five $1,000 bills. The same 5 in the tens spot is five $10 bills. Same digit, very different pile. Expanded form just adds up the piles: 5,000 + 50.",example:"6,203 = 6,000 + 200 + 3   (there are no tens, so nothing to add)",qs:[{type:"mc",prompt:"Which shows the [[expanded form]] of 92,060?",options:["9,000 + 2,000 + 600","90,000 + 200 + 60","90,000 + 2,000 + 60","9,000 + 200 + 6"],a:2,hint:"Say the number out loud: ninety-two thousand, sixty. What is the 9 really worth?",exp:"The 9 is worth 90,000, the 2 is worth 2,000, and the 6 is worth 60. Expanded form just adds those values: 90,000 + 2,000 + 60. No multiplying shown \u2014 that's expanded notation, which is the next stop."},{type:"entry",prompt:"In the number 38,514, what is the value of the digit 8?",a:8e3,hint:"Count the spots from the right: ones, tens, hundreds, thousands.",exp:"The 8 is in the thousands place, so it is worth 8,000 \u2014 not 8."},{type:"mc",prompt:"A number has 4 ten thousands, 0 thousands, 7 hundreds, 9 tens, and 2 ones. What is the number?",options:["4,792","40,792","47,092","40,079"],a:1,hint:"Write a digit for every single spot, even the empty one.",exp:"4 ten thousands and 0 thousands means you must write the zero: 40,792. Skipping it would shrink the number by ten times."}]},{id:"expnotation",region:"num",icon:"\u2716\uFE0F",teks:"3.2A",title:"Expanded notation",idea:"[[expanded notation]] shows each digit TIMES its place value, then adds them. It is different from [[expanded form]], which only shows the values. 4,706 in expanded form is 4,000 + 700 + 6. In expanded notation it is (4 \xD7 1,000) + (7 \xD7 100) + (6 \xD7 1).",another:"Expanded form shows the money piles: 4,000 + 700 + 6. Expanded notation shows how you made each pile: four $1,000 bills is 4 \xD7 1,000, seven $100 bills is 7 \xD7 100. Same number, it just shows the multiplying.",example:"6,203 in expanded form: 6,000 + 200 + 3.   In expanded notation: (6 \xD7 1,000) + (2 \xD7 100) + (3 \xD7 1).",qs:[{type:"mc",prompt:"Which shows the [[expanded notation]] of 92,060?",options:["(9 \xD7 1,000) + (2 \xD7 1,000) + (6 \xD7 100)","(9 \xD7 10,000) + (2 \xD7 100) + (6 \xD7 10)","(9 \xD7 10,000) + (2 \xD7 1,000) + (6 \xD7 10)","90,000 + 2,000 + 60"],a:2,hint:"Expanded notation needs a \xD7 in every part. Which spot is the 9 in?",exp:"The 9 is in the ten thousands spot (9 \xD7 10,000), the 2 is in the thousands spot (2 \xD7 1,000), and the 6 is in the tens spot (6 \xD7 10). Choice D is the right number, but it's expanded FORM \u2014 no multiplying shown."},{type:"mc",prompt:"Which one is written in expanded NOTATION?",options:["3,000 + 500 + 20 + 8","(3 \xD7 1,000) + (5 \xD7 100) + (2 \xD7 10) + (8 \xD7 1)","3,528","three thousand, five hundred twenty-eight"],a:1,hint:"Look for the one that shows multiplying.",exp:"Only choice B shows each digit times its place value. Choice A is expanded form, C is standard form, and D is word form. They're all the same number, written four different ways."},{type:"entry",prompt:"What number is (4 \xD7 1,000) + (7 \xD7 100) + (5 \xD7 1)?",a:4705,hint:"Find each part's value, then add. Is there any tens part?",exp:"4,000 + 700 + 5 = 4,705. There is no tens part, so the tens spot gets a 0."},{type:"place",prompt:"Finish the expanded notation for 63,480. Drag the right place value to each digit.",tiles:["\xD7 10,000","\xD7 1,000","\xD7 100","\xD7 10"],slots:[{lab:"6",a:"\xD7 10,000"},{lab:"3",a:"\xD7 1,000"},{lab:"4",a:"\xD7 100"},{lab:"8",a:"\xD7 10"}],hint:"Name the spots from the right: ones, tens, hundreds, thousands, ten thousands.",exp:"63,480 = (6 \xD7 10,000) + (3 \xD7 1,000) + (4 \xD7 100) + (8 \xD7 10). The 0 is in the ones spot, so there's no ones part."},{type:"mc",prompt:"What is the difference between expanded form and expanded notation?",options:["There is no difference","Expanded notation shows each digit times its place value; expanded form only adds the values","Expanded form uses multiplying; expanded notation uses subtracting","Expanded notation only works for small numbers"],a:1,hint:"Think about which one has \xD7 signs.",exp:"Both add up the pieces of a number. Expanded notation shows the multiplying, like (5 \xD7 100). Expanded form shows just the value, like 500."}]},{id:"compare",region:"num",icon:"\u2696\uFE0F",teks:"3.2C, 3.2D",title:"Comparing and rounding",idea:"To compare, line the numbers up and check the biggest spot first. The first spot where they differ decides it \u2014 nothing after that matters.",another:"For [[round]]ing, picture a number line. Which friendly number is your number closest to? If it lands exactly in the middle, go up.",example:"1,309 vs 1,290 \u2192 thousands same, hundreds 3 vs 2 \u2192 1,309 is greater. Stop there.",qs:[{type:"mc",prompt:`Which comparison is true?
Friday 1,298   Saturday 1,309   Sunday 1,290   Monday 1,398`,options:["Saturday's number > Sunday's number","Friday's number = Monday's number","Monday's number < Sunday's number","Sunday's number > Friday's number"],a:0,hint:"The open mouth of the symbol always eats the bigger number.",exp:"Both numbers have 1 thousand, so move right. Hundreds: 1,309 has 3 and 1,290 has 2. Three hundreds beats two, so Saturday is greater. True."},{type:"place",prompt:"Drag the correct symbol into each box.",tiles:["<",">","="],slots:[{lab:"45,120 ___ 45,210",a:"<"},{lab:"8,006 ___ 8,060",a:"<"}],hint:"Compare one spot at a time, starting from the left.",exp:"45,120 vs 45,210: thousands match, hundreds 1 vs 2, so the first is smaller. 8,006 vs 8,060: tens 0 vs 6, so again the first is smaller."},{type:"mc",prompt:"A point on a number line sits between 8,000 and 10,000, much closer to 8,000. Which statement is best?",options:["The number was less than 8,000.","The number was greater than 10,000.","The number was about 10,000 because the point is closer to 10,000.","The number was about 8,000 because the point is closer to 8,000."],a:3,hint:"Closer to means rounds to.",exp:"The point is between the two, so it is not less than 8,000 or greater than 10,000. Since it is nearer 8,000, that's the best estimate."}]},{id:"fractions",region:"num",icon:"\u{1F355}",teks:"3.3A\u2013H, 3.7A",title:"Fractions: parts, number lines, equal amounts",idea:"The [[denominator]] tells how many equal pieces the whole was cut into. The [[numerator]] tells how many you took. Bigger denominator means MORE cuts, so SMALLER pieces.",another:"Think about sharing one candy bar. Split it with 2 friends, you get a big chunk. Split the same bar with 8 friends and your piece is tiny \u2014 even though 8 is a bigger number.",example:"1/3 and 2/6 are [[equivalent]]. Same amount of bar, just cut differently.",qs:[{type:"shade",prompt:"Shade the model to show 3/4.",parts:4,a:3,hint:"The bottom number tells you how many pieces there are. The top tells you how many to color.",exp:"The whole is cut into 4 equal parts, so each part is 1/4. Shading 3 of them shows 3/4."},{type:"mc",prompt:"Which fraction is greater, 2/3 or 2/8?",options:["2/8, because 8 is bigger than 3","2/3, because thirds are bigger pieces than eighths","They are equal","You cannot tell without a picture"],a:1,hint:"Same number of pieces taken. Which pieces are bigger?",exp:"Both take 2 pieces. But cutting into 3 makes fat pieces and cutting into 8 makes skinny ones. Two fat pieces beat two skinny ones. This is the trick the test loves."},{type:"mc",prompt:"Which fraction is [[equivalent]] to 2/3?",options:["3/2","2/6","4/6","3/4"],a:2,hint:"If you cut every piece in half, you get twice as many pieces AND take twice as many.",exp:"Double both parts of 2/3 and you get 4/6. Same amount of the whole, just more cuts."}]},{id:"addsub",region:"ops",icon:"\u2795",teks:"3.4A, 3.5A",title:"Adding and subtracting, one step and two",idea:"A two-step problem hides a second question inside the first. Find the hidden middle number before you can find the answer.",another:"Read it like a story with a beginning, middle, and end. What did I start with? What changed? Then what changed again?",example:"368 nickels, and 109 MORE dimes than nickels. Step 1: dimes = 368 + 109 = 477. Step 2: total = 368 + 477 = 845.",qs:[{type:"entry",prompt:"A park had 356 adults and 598 children last week. What was the total number of visitors?",a:954,hint:"Total means put them together.",exp:"356 + 598 = 954. Adding 600 and taking back 2 is a fast way: 356 + 600 = 956, then 956 \u2212 2 = 954."},{type:"multi",prompt:"Skye won 465 points, lost 192 points, then won 309 points. Which equations find her total? Select TWO.",options:["465 + 309 = ","465 + 309 \u2212 192 = ","465 + 309 + 192 = ","465 \u2212 192 + 309 = ","465 \u2212 192 = "],a:[1,3],pick:2,hint:"Won means add. Lost means subtract. All three rounds must appear.",exp:"You need all three numbers with the right signs. Both 465 + 309 \u2212 192 and 465 \u2212 192 + 309 do that \u2014 order doesn't matter here, but the minus must stay on the 192."},{type:"mc",prompt:"A teacher bought 18 red markers and 6 boxes of blue markers with 10 in each box. How many markers in all?",options:["78","34","60","24"],a:0,hint:"You can't add 18 and 6. Find the blue markers first.",exp:"Blue: 6 \xD7 10 = 60. Then 60 + 18 = 78. The trap answer is 24, which comes from adding 18 + 6 without thinking."}]},{id:"mult",region:"ops",icon:"\u2716\uFE0F",teks:"3.4D\u2013G, 3.5B, 3.5C",title:"What multiplying really means",idea:"Multiplying is equal groups. 7 \xD7 6 means seven groups with six in each. An [[array]] shows the same thing as rows and columns.",another:"'3 times as many' means take the amount and stack it three times. If a shop sold 15 small sets and 3 \xD7 15 large ones, the LARGE pile is the big one.",example:"6 apples in each of 7 bags \u2192 7 \xD7 6 = 42 apples.",qs:[{type:"mc",prompt:"A shop sold 15 small brick sets. Large sets sold = 3 \xD7 15. Which statement is true?",options:["Large is 15 times the number of small.","Small is 15 times the number of large.","Large is 3 times the number of small.","Small is 3 times the number of large."],a:2,hint:"The 3 is doing the multiplying. Which pile grew?",exp:"3 \xD7 15 means three groups of 15, so there are 3 times as many large sets as small ones. Watch the word order carefully \u2014 the test swaps it on purpose."},{type:"entry",prompt:"A box top will be covered with 6 rows of 8 square tiles. How many tiles?",a:48,hint:"Rows times how many in each row.",exp:"6 \xD7 8 = 48 tiles. This is exactly how [[area]] works too."},{type:"mc",prompt:"Which method can be used to solve 3 \xD7 7?",options:["7 \xD7 7 \xD7 7","7 + 7 + 7","Count 7, 10, 13, 16, 19, 22, 25, 28","3 + 7"],a:1,hint:"Three groups of seven. Write them out.",exp:"3 \xD7 7 is three sevens added: 7 + 7 + 7 = 21. Choice A multiplies three times instead. Choice C adds 3 over and over, which is 7 \xD7 3 counted wrong."}]},{id:"div",region:"ops",icon:"\u2797",teks:"3.4H, 3.4J, 3.4K, 3.5D",title:"Dividing and finding what's missing",idea:"Dividing is fair sharing. 12 blocks into 4 equal groups means each group gets 3. Multiplication and division are the same fact backwards.",another:"If you forget a division fact, ask a multiplication question instead. 54 \xF7 6 is really 'six times WHAT equals 54?'",example:"Missing factor: 8 \xD7 ___ = 56. Ask what times 8 makes 56 \u2192 7.",qs:[{type:"mc",prompt:"Rami made 54 muffins and put 6 in each box. How many boxes did he need?",options:["48","60","9","6"],a:2,hint:"Six times what equals fifty-four?",exp:"54 \xF7 6 = 9 boxes. The wrong answers come from subtracting (48) or adding (60) instead of dividing."},{type:"mc",prompt:"Glynna has 3 boxes of 8 candles and will split them evenly onto 4 cakes. Which equation finds the candles per cake?",options:["3 \xD7 8 \xD7 4 = ","3 + 8 \xF7 4 = ","3 + 8 \xD7 4 = ","3 \xD7 8 \xF7 4 = "],a:3,hint:"First find how many candles there are, then share them out.",exp:"3 \xD7 8 = 24 candles total, then 24 \xF7 4 = 6 per cake. The equation must multiply first, then divide."},{type:"entry",prompt:"A librarian places 36 books evenly on 4 shelves. How many books per shelf?",a:9,hint:"Four times what equals thirty-six?",exp:"36 \xF7 4 = 9. Check it backwards: 4 \xD7 9 = 36. \u2713"}]},{id:"tables",region:"ops",icon:"\u{1F4CB}",teks:"3.5E",title:"Finding the rule in a table",idea:"A table hides a rule. Test your rule on EVERY row, not just the first one. If it only works once, it's the wrong rule.",another:"Ask yourself: did the numbers grow by adding the same amount each time, or by multiplying by the same amount?",example:"Robots 3 \u2192 wheels 9. Robots 8 \u2192 wheels 24. 3 + 6 = 9 works... but 8 + 6 = 14, not 24. So it isn't adding. 3 \xD7 3 = 9 and 8 \xD7 3 = 24. The rule is times 3.",qs:[{type:"inline",prompt:"Robots made: 3, 8, 13, 18. Wheels needed: 9, 24, 39, 54. Complete the sentence.",sentence:["The number of wheels is equal to the number of robots ",0," ",1,"."],blanks:[{choices:["plus","times"],a:1},{choices:["3","5","6","15"],a:0}],hint:"Try your rule on the last row too, not just the first.",exp:"3 \xD7 3 = 9, 8 \xD7 3 = 24, 13 \xD7 3 = 39, 18 \xD7 3 = 54. The rule 'times 3' works for all four rows. 'Plus 6' only works for the first row."},{type:"entry",prompt:"The rule is 'times 4'. If the input is 7, what is the output?",a:28,hint:"Apply the rule to 7.",exp:"7 \xD7 4 = 28."},{type:"mc",prompt:"A table shows: 2 \u2192 10, 4 \u2192 20, 6 \u2192 30. What is the rule?",options:["Add 8","Times 5","Add 10","Times 2"],a:1,hint:"Check the middle row before you decide.",exp:"2 \xD7 5 = 10, 4 \xD7 5 = 20, 6 \xD7 5 = 30. 'Add 8' works only for the first row \u2014 a classic trap."}]},{id:"shapes",region:"geo",icon:"\u{1F537}",teks:"3.6A, 3.6B",title:"Sorting shapes by their attributes",idea:"Sort by what a shape HAS, not what it looks like. Count sides, corners, and [[face]]s. A [[quadrilateral]] is any shape with exactly 4 straight sides.",another:"Squares are rectangles. Rectangles are [[parallelogram]]s. Parallelograms are quadrilaterals. Each one is a special member of the bigger family \u2014 like how a poodle is still a dog.",example:"A [[cylinder]] has 2 flat circle faces. A [[cone]] has 1. A [[sphere]] has none.",qs:[{type:"place",prompt:"Sort each solid by how many flat faces it has.",tiles:["Sphere","Cone","Cylinder","Cube"],slots:[{lab:"0 flat faces",a:"Sphere"},{lab:"1 flat face",a:"Cone"},{lab:"2 flat faces",a:"Cylinder"},{lab:"6 flat faces",a:"Cube"}],hint:"Picture holding each one. Where could you set it down flat?",exp:"A ball has no flat spot. A cone has just the circle bottom. A can has a top and bottom. A cube has 6 square faces."},{type:"mc",prompt:"Which statement is true about ALL rectangles?",options:["All rectangles are squares.","All rectangles are [[quadrilateral]]s.","All rectangles have 4 equal sides.","All rectangles are [[rhombus]]es."],a:1,hint:"Careful with the word ALL. One counterexample kills it.",exp:"Every rectangle has 4 straight sides, so all rectangles are quadrilaterals. But a long skinny rectangle is not a square and has no 4 equal sides \u2014 so the others fail."},{type:"mc",prompt:"Which shape is NOT a [[polygon]]?",options:["Triangle","Hexagon","Circle","Trapezoid"],a:2,hint:"Polygons are made only of straight sides.",exp:"A circle is curved with no straight sides, so it isn't a polygon."}]},{id:"area",region:"geo",icon:"\u{1F7E6}",teks:"3.6C, 3.6D",title:"Area: covering the inside",idea:"[[Area]] is how many unit squares fit inside. Multiply rows \xD7 how many in each row. The answer is in SQUARE units.",another:"For a weird L-shaped figure, chop it into two rectangles, find each area, then add them together.",example:"A rectangle 10 rows of 4 \u2192 10 \xD7 4 = 40 square inches.",qs:[{type:"entry",prompt:"A rectangle is 9 units long and 5 units wide. What is its [[area]] in square units?",a:45,hint:"Length times width.",exp:"9 \xD7 5 = 45 square units."},{type:"mc",prompt:"An L-shape is made of a 4 \xD7 3 rectangle and a 2 \xD7 3 rectangle. What is the total area?",options:["12 square units","18 square units","9 square units","24 square units"],a:1,hint:"Find each rectangle's area, then combine.",exp:"4 \xD7 3 = 12 and 2 \xD7 3 = 6. Then 12 + 6 = 18 square units. Splitting the figure is always allowed."},{type:"mc",prompt:"Why is area measured in SQUARE units?",options:["Because the shape is always a square","Because you are counting little squares that cover the space","Because you multiply two numbers","Because it sounds better"],a:1,hint:"Think about what you are actually counting.",exp:"Area counts how many unit squares tile the inside, so the label is square inches, square centimeters, and so on. [[Perimeter]] is just plain units because you're measuring a line."}]},{id:"perimeter",region:"geo",icon:"\u{1F4CF}",teks:"3.7B",title:"Perimeter: walking the fence",idea:"[[Perimeter]] is the total distance around the outside. Add up every side. If all sides are equal, you can multiply instead.",another:"Perimeter is the fence. Area is the grass inside the fence. The test will hand you one and ask for the other, so read carefully.",example:"An octagon with all sides 3 cm: 8 sides \xD7 3 = 24 cm.",qs:[{type:"mc",prompt:"Samantha drew an octagon with each side measuring 3 centimeters. What is its [[perimeter]]?",options:["11 cm","24 cm","16 cm","64 cm"],a:1,hint:"How many sides does an octagon have?",exp:"An octagon has 8 sides. 8 \xD7 3 = 24 cm. Choice A comes from adding 8 + 3, which is a very common slip."},{type:"entry",prompt:"A rectangle has sides 7 m, 4 m, 7 m, and 4 m. What is the perimeter in meters?",a:22,hint:"Add all four sides.",exp:"7 + 4 + 7 + 4 = 22 meters. Don't stop at 11 \u2014 that's only two sides."},{type:"entry",prompt:"A triangle has a perimeter of 20 cm. Two sides are 6 cm and 8 cm. How long is the third side in cm?",a:6,hint:"Add the two you know, then figure out what's left.",exp:"6 + 8 = 14. Then 20 \u2212 14 = 6 cm. Working backwards from a known perimeter shows up on the test often."}]},{id:"measure",region:"geo",icon:"\u23F0",teks:"3.7C, 3.7D, 3.7E",title:"Time and choosing the right unit",idea:"For time, count forward: whole hours first, then minutes. For units, ask whether you are measuring liquid you could pour, or weight you could hold.",another:"Match the unit to the size of the thing. Milliliters for a spoonful, liters for a bottle. Ounces for a slice of bread, pounds for a backpack.",example:"A movie starts at 6:45 and lasts 1 hour 15 minutes. 6:45 + 1 hour = 7:45. Then + 15 min = 8:00.",qs:[{type:"mc",prompt:"A movie started at 6:45 and lasted 1 hour 15 minutes. What time did it end?",options:["8:00","10:45","5:30","7:24"],a:0,hint:"Add the hour first, then the minutes.",exp:"6:45 + 1 hour = 7:45. Then 7:45 + 15 minutes = 8:00."},{type:"place",prompt:"Choose the best unit for measuring each item.",tiles:["milliliters","liters","ounces","pounds"],slots:[{lab:"Medicine in a spoon",a:"milliliters"},{lab:"Water in a big jug",a:"liters"},{lab:"A slice of bread",a:"ounces"},{lab:"A full backpack",a:"pounds"}],hint:"Small thing, small unit. Big thing, big unit. Liquid or weight?",exp:"Milliliters and liters measure liquid [[volume]]. Ounces and pounds measure weight. Then match small to small and big to big."},{type:"entry",prompt:"Build club starts at 1:20 and lasts 25 minutes. It is now 1:35. How many minutes are left?",a:10,hint:"Figure out when build club ends first.",exp:"1:20 + 25 minutes ends at 1:45. From 1:35 to 1:45 is 10 minutes left."}]},{id:"graphs",region:"dat",icon:"\u{1F4CA}",teks:"3.8A, 3.8B",title:"Reading graphs without getting tricked",idea:"Always check the [[scale]] first. If bars count by 5s, a bar reaching the third line means 15, not 3. On a [[pictograph]], read the key \u2014 one picture can stand for 2, 5, or 10.",another:"A [[dot plot]] stacks one dot per item. To check one, count how many times a number appears in the data list and see if the dots match.",example:"Data: 6, 8, 6, 12, 6. The number 6 appears three times, so its column has exactly 3 dots.",qs:[{type:"mc",prompt:"A [[pictograph]] key says each \u2B50 = 4 books. A row shows 6 stars. How many books?",options:["6","10","24","4"],a:2,hint:"Each picture is worth more than one.",exp:"6 stars \xD7 4 books each = 24 books. Counting the pictures instead of using the key is the classic mistake."},{type:"entry",prompt:"A [[bar graph]] counts by 5s. A bar reaches the fourth line above zero. What number does it show?",a:20,hint:"Count by the scale, not by ones.",exp:"Counting by 5s: 5, 10, 15, 20. The fourth line is 20."},{type:"mc",prompt:"Eggs collected: 14, 7, 6, 12, 5, 13, 8, 6, 10, 12, 6, 8, 6, 14. How many dots go above the number 6?",options:["2","3","4","6"],a:2,hint:"Go through the list slowly and mark each 6.",exp:"The 6 shows up four times in the list, so the column above 6 has 4 dots. Cross off each number as you count so you don't miss one."}]},{id:"money",region:"dat",icon:"\u{1F4B5}",teks:"3.4C, 3.9",title:"Money, saving, and borrowing",idea:"Count coins from biggest to smallest. For money questions in words, ask: is this about earning, saving, spending, or borrowing?",another:"Saving means putting money aside for later, and the bank may pay you [[interest]]. [[Credit]] is the opposite \u2014 you borrow now and pay back more later.",example:"3 quarters, 2 dimes, 1 nickel = 75 + 20 + 5 = 100\xA2 = $1.00",qs:[{type:"entry",prompt:"Count the total in cents: 2 quarters, 3 dimes, 4 pennies.",a:84,hint:"Quarter 25, dime 10, nickel 5, penny 1. Start with the biggest.",exp:"50 + 30 + 4 = 84 cents."},{type:"mc",prompt:"Alberto is paid for the hours he works. Which statement is most likely true?",options:["The more hours he works, the less he earns.","The fewer hours he works, the less he earns.","The more hours he works, the less labor he provides.","The fewer hours he works, the more labor he provides."],a:1,hint:"More work should mean more pay. Which choice matches that?",exp:"Working fewer hours means earning less. This is the link between labor and [[income]]. The other choices reverse the relationship."},{type:"mc",prompt:"Maia puts some earnings into a savings account each month. Which statement is true?",options:["Maia must pay [[interest]] on money in her savings account.","The account lets her plan for a large purchase later.","She must put in the same amount every month.","The bank won't let her spend it until college."],a:1,hint:"Saving is about planning ahead, not about rules.",exp:"Saving lets you plan for something big later. You pay interest when you BORROW, not when you save \u2014 banks usually pay you instead."}]},{id:"vocab",region:"read",icon:"\u{1F524}",teks:"3.3B, 3.3C, 3.3D",title:"Figuring out words you don't know",idea:"You do not need to already know a word. Read the whole sentence, then the one before and after. The [[context clue]]s will hand you the meaning.",another:"Break the word into parts. A [[prefix]] like un- or re- changes the front. A [[suffix]] like -ful or -less changes the end. 'Unhelpful' = not + help + full of.",example:"'The robot was immobile, frozen in place until someone pressed the switch.' You never learned immobile \u2014 but the sentence just told you it means not moving.",qs:[{type:"mc",prompt:'"Milo waited impatiently, tapping his foot and checking the clock every ten seconds." What does impatiently mean?',options:["Very quietly","Not able to wait calmly","With great skill","In a sleepy way"],a:1,hint:"The [[prefix]] im- means not. What else in the sentence shows how he felt?",exp:"im- means not, and patient means able to wait calmly. The foot tapping and clock checking confirm it."},{type:"mc",prompt:"Which word is a [[homophone]] for 'their'?",options:["Theirs","There","Them","Thair"],a:1,hint:"Homophones sound identical but mean different things.",exp:"'There' sounds exactly like 'their' but means a place. 'They're' is a third one, short for they are."},{type:"place",prompt:"Match each word to its meaning.",tiles:["rebuild","helpless","kindness","preview"],slots:[{lab:"Build again",a:"rebuild"},{lab:"Without help",a:"helpless"},{lab:"The state of being kind",a:"kindness"},{lab:"To view before",a:"preview"}],hint:"Chop off the [[prefix]] or [[suffix]] and look at what's left.",exp:"re- means again, -less means without, -ness turns it into a thing you can have, pre- means before."}]},{id:"infer",region:"read",icon:"\u{1F50D}",teks:"3.6F, 3.7C, 3.8A\u2013D",title:"Inferring and proving it with the text",idea:"An [[inference]] is text clues PLUS what you already know. The author doesn't say it straight out, but the story shows it.",another:"After you pick an answer, go back and find the exact sentence that proves it. If you cannot point at a line, your answer is probably a guess.",example:"The story never says Milo was generous. It says he lifted his sister up and said nothing. You infer it from what he did.",passage:"brick",qs:[{type:"mc",prompt:"Why does Milo say nothing at all when he lifts Rosa up?",options:["He is too angry to speak.","He has decided to give up his plan without making a fuss.","He does not know her name.","He is afraid of his grandpa."],a:1,hint:"Look at what he noticed right before he moved.",exp:"He looked at how hard she was trying and how she had sorted the pieces every morning. He changes his mind and gives up the brick quietly. The text never says angry or afraid."},{type:"mc",prompt:"What is the [[theme]] of this story?",options:["Gold bricks are the best pieces.","Big brothers make unfair rules.","Sometimes giving something up brings you something better.","Building towers is hard work."],a:2,hint:"[[Theme]] is the lesson, not the topic. The topic is a brick. What's the lesson?",exp:"Milo gives up his plan, and Rosa offers to build together anyway. The lesson is about generosity coming back around. 'Gold bricks' and 'building' are topics, not lessons."},{type:"mc",prompt:"Which sentence is the best [[evidence]] that Rosa worked hard for the set?",options:['"Her hand was stretched up."','"she had sorted every loose piece into the right tray each morning without being asked"','"Rosa pulled out the gold brick."','"Their grandpa, watching from the doorway, smiled into his coffee."'],a:1,hint:"Which line actually mentions work she did?",exp:"Only that line describes effort over time. The others describe a single moment."}]},{id:"infotext",region:"read",icon:"\u{1F4F0}",teks:"3.9D, 3.9E, 3.10A",title:"Informational and argument texts",idea:"Informational text teaches you facts. Argumentative text tries to change your mind \u2014 it has a [[claim]] and reasons. Ask: is the author teaching me, or convincing me?",another:"A [[fact]] can be checked and proven. An [[opinion]] uses words like should, best, worst, or I think. Spot those words and you've spotted the opinion.",example:"'A cheetah runs about seventy miles per hour' \u2014 fact. 'Cheetahs are the coolest animal alive' \u2014 opinion.",passage:"speed",qs:[{type:"mc",prompt:"What is the [[central idea]] of 'Built for Speed'?",options:["Cheetahs are the fastest animals alive.","Different animals are built for speed in different ways, and speed has a cost.","Falcons live in the sky.","Sailfish have long bills."],a:1,hint:"The central idea has to cover the WHOLE passage, not just one paragraph.",exp:"The passage covers air, land, and ocean, plus what speed costs a cheetah. The other choices are true details but too small to be the central idea."},{type:"multi",prompt:"Which statements from the passage are FACTS? Select TWO.",options:["The peregrine falcon is the coolest bird alive.","A cheetah can sprint about seventy miles per hour.","Everyone should watch a falcon dive.","A cheetah can run flat out for about thirty seconds.","Sailfish are scary."],a:[1,3],pick:2,hint:"A fact can be measured and proven. Watch for coolest, should, and scary.",exp:"Speed and time can both be measured with tools. 'Coolest', 'should', and 'scary' are opinions \u2014 they're what someone thinks."},{type:"mc",prompt:"In 'Give Us Back Our Build Time', what is the author's [[claim]]?",options:["Building uses math.","The shortened build club should be changed back to thirty minutes.","Fifteen minutes goes by fast.","Build club happens on Fridays."],a:1,hint:"The claim is what the author wants to HAPPEN.",exp:"The first and last paragraphs both say the change was a mistake and should be reversed. The other choices are reasons or details supporting that claim."}]},{id:"craft",region:"read",icon:"\u{1F3AD}",teks:"3.10A\u2013G",title:"Why the author wrote it that way",idea:"[[Author's purpose]] comes in three flavors: to inform, to persuade, or to entertain. Ask what the author wanted YOU to do after reading.",another:"Authors choose words on purpose. A [[simile]] compares with like or as. [[Hyperbole]] is a wild exaggeration. Neither is meant literally \u2014 they're there to make a picture.",example:"'Built like a tiny tank' is a comparison that helps you picture armor without a long explanation.",passage:"buildtime",qs:[{type:"mc",prompt:"What is the author's purpose in 'Give Us Back Our Build Time'?",options:["To entertain readers with a funny story","To inform readers about club schedules","To persuade the school to restore longer build time","To describe what build club looks like"],a:2,hint:"What does the author want to happen after you read it?",exp:"The author states a [[claim]], gives reasons, and ends with a request. That's persuading."},{type:"mc",prompt:'"I was so hungry I could have eaten the whole cafeteria." This is an example of \u2014',options:["a [[simile]]","[[hyperbole]]","[[onomatopoeia]]","a fact"],a:1,hint:"Could anyone really do that?",exp:"It's a huge exaggeration nobody is meant to believe, which is hyperbole. A simile would need like or as."},{type:"mc",prompt:'A story begins, "I woke up before the sun and pulled on my boots." What [[point of view]] is this?',options:["First person","Third person","Second person","You cannot tell"],a:0,hint:"Look at the pronoun the narrator uses.",exp:"The narrator uses 'I', so the story is told in first person by someone inside the story."}]},{id:"grammar",region:"write",icon:"\u{1F527}",teks:"3.11D",title:"Fixing sentences",idea:"For editing questions, read the sentence out loud in your head. Your ear catches most mistakes before your eyes do.",another:"Check three things every time: does the verb match the subject, is the [[tense]] consistent, and is the punctuation doing a job?",example:"'The dogs runs fast' sounds wrong because two dogs need 'run', not 'runs'.",qs:[{type:"mc",prompt:"Which sentence is written correctly?",options:["The three birds sings in the tree.","The three birds sing in the tree.","The three bird sing in the tree.","The three birds singing in the tree."],a:1,hint:"Say it out loud. Does the verb match the number of birds?",exp:"More than one bird needs 'sing'. That's [[subject-verb agreement]]. Choice D isn't a complete sentence."},{type:"inline",prompt:"Choose the correct words to finish the sentence.",sentence:["Yesterday my brother ",0," to the store, and he ",1," milk."],blanks:[{choices:["walk","walked","walks"],a:1},{choices:["buy","buys","bought"],a:2}],hint:"The word Yesterday tells you when this happened.",exp:"'Yesterday' means past [[tense]], so both verbs must be past: walked and bought. Mixing tenses inside one sentence is the trap here."},{type:"mc",prompt:'Where does the comma belong? "We wanted to go outside but it started raining."',options:["After We","After outside","After but","No comma is needed"],a:1,hint:"This is a [[compound sentence]]. Two full sentences are joined.",exp:"'We wanted to go outside' and 'it started raining' are both complete sentences joined by 'but', so a comma goes before the joining word: outside, but it started raining."}]},{id:"revise",region:"write",icon:"\u2728",teks:"3.11B, 3.11C",title:"Making writing better",idea:"Revising is different from editing. Editing fixes mistakes. Revising makes the writing clearer and stronger, even when nothing is broken.",another:"A good paragraph sticks to one idea. If a sentence wanders off the topic, it should go \u2014 even if it's a nice sentence.",example:"In a paragraph about training a puppy, 'My uncle lives in Houston' does not belong, no matter how true it is.",qs:[{type:"mc",prompt:"A paragraph is about how to plant a garden. Which sentence should be REMOVED?",options:["First, choose a sunny spot.","Water the seeds gently each morning.","My favorite movie came out last summer.","Pull weeds so they don't crowd the plants."],a:2,hint:"Which one has nothing to do with gardens?",exp:"The movie sentence is off topic. Every sentence in a paragraph should support the same idea."},{type:"mc",prompt:"Which sentence gives the most vivid detail?",options:["The dog was happy.","The dog wagged its tail so hard its whole back end swung.","The dog was a good dog.","The dog felt nice."],a:1,hint:"Which one lets you SEE it?",exp:"Showing beats telling. The second sentence uses [[imagery]] \u2014 you can picture it. The others just state a feeling."},{type:"mc",prompt:"Which is the best CONCLUSION for an opinion essay about longer build time?",options:["Build club is on Friday.","In conclusion, a longer build time would help students learn, so our school should bring it back.","Some people like race cars.","I have three brothers."],a:1,hint:"A conclusion wraps up the argument and repeats what you want.",exp:"A strong conclusion restates the [[claim]] and gives the reason one more time. The others are stray facts."}]}],$T={placevalue:{goals:[["\u{1F522}","Tell what each digit is really worth"],["\u{1F9E9}","Break a number into its pieces"],["0\uFE0F\u20E3","Know why a zero still matters"]],steps:["Start at the right and name each spot: ones, tens, hundreds, thousands, ten thousands.","Point at your digit and say the spot name out loud.","Multiply the digit by that spot's value. The 7 in the hundreds spot is 7 \xD7 100 = 700.","For expanded form, write each digit's VALUE and add them with plus signs: 4,000 + 700 + 6. Skip a spot if the digit is 0. (Showing the \xD7 is expanded notation \u2014 that's the next stop.)"]},expnotation:{goals:[["\u2716\uFE0F","Write a number as digit \xD7 place value"],["\u{1F500}","Tell expanded notation apart from expanded form"],["0\uFE0F\u20E3","Skip a place when the digit is 0"]],steps:["Name each spot from the right: ones, tens, hundreds, thousands, ten thousands.","For each digit, write it TIMES its spot's value, like (7 \xD7 100). Put each one in parentheses.","Join them with plus signs. Leave out any spot where the digit is 0.","Check: if the answer has no \xD7 signs, that's expanded form, not expanded notation."]},compare:{goals:[["\u2696\uFE0F","Decide which number is bigger"],["\u270D\uFE0F","Use the symbols the right way"],["\u{1F3AF}","Round to a friendly number"]],steps:["Stack the numbers so the ends line up on the right.","Start at the LEFT and compare one spot at a time.","The first spot where they're different decides it. Stop right there \u2014 nothing after matters.","To round, ask which friendly number it sits closer to on the number line."]},fractions:{goals:[["\u{1F355}","Read what a fraction is telling you"],["\u{1F4CF}","Find fractions on a number line"],["\u{1F91D}","Spot fractions worth the same amount"]],steps:["Look at the bottom number. That's how many equal pieces the whole was cut into.","Look at the top number. That's how many pieces you're holding.","To compare with the same top number, remember: bigger bottom means MORE cuts, so SMALLER pieces.","To find an equivalent fraction, multiply top and bottom by the same number."]},addsub:{goals:[["\u2795","Add and subtract within 1,000"],["\u{1F575}\uFE0F","Find the hidden middle step"],["\u2705","Check if your answer makes sense"]],steps:["Read the whole problem once without doing any math.","Ask: can I answer this in one step, or is a number missing?","If a number is missing, find THAT first. It's the hidden middle step.","Do step two using your middle number. Then reread the question to be sure you answered what was asked."]},mult:{goals:[["\u2716\uFE0F","Understand what multiplying means"],["\u{1F532}","Read arrays and equal groups"],["\u{1F501}","Know 'times as many' language"]],steps:["Turn the numbers into a sentence: 7 \xD7 6 means seven groups of six.","Draw it fast if you're stuck \u2014 rows of dots work.","For 'times as many', the number doing the multiplying tells you how much BIGGER the second pile is.","Check with repeated addition: 3 \xD7 7 should equal 7 + 7 + 7."]},div:{goals:[["\u2797","Share things out equally"],["\u{1F504}","Flip division into multiplication"],["\u2753","Find a missing factor"]],steps:["Ask what's being shared and how many groups there are.","Turn it around: 54 \xF7 6 is the same as 'six times what equals 54?'","Use a fact you already know to get there.","Check backwards. If 54 \xF7 6 = 9, then 6 \xD7 9 should equal 54."]},tables:{goals:[["\u{1F4CB}","Find the rule hiding in a table"],["\u{1F9EA}","Test your rule on every row"],["\u27A1\uFE0F","Use the rule on a new number"]],steps:["Look at the first pair. Guess a rule \u2014 adding or multiplying.","Test that same rule on the SECOND row. Then the third.","If it fails on any row, throw it out and try the other operation.","Once a rule works on every row, use it to answer the question."]},shapes:{goals:[["\u{1F537}","Sort shapes by their attributes"],["\u{1F468}\u200D\u{1F469}\u200D\u{1F467}","Know which shapes belong to which family"],["\u{1F9CA}","Count faces on solid shapes"]],steps:["Count the straight sides. Four sides means quadrilateral.","Count corners and check if opposite sides are parallel.","For solids, count the FLAT faces. A ball has none, a can has two, a cube has six.","Watch for the word ALL. One shape that breaks the rule makes the whole statement false."]},area:{goals:[["\u{1F7E6}","Find how much space is inside"],["\u2716\uFE0F","Use rows times columns"],["\u2702\uFE0F","Split odd shapes into rectangles"]],steps:["Ask: am I covering the inside, or measuring around it? Inside means area.","Multiply rows \xD7 how many in each row.","For an L-shape, draw a line to cut it into two rectangles.","Find each rectangle's area, add them, and label the answer in SQUARE units."]},perimeter:{goals:[["\u{1F4CF}","Measure all the way around"],["\u{1F522}","Add up every side"],["\u{1F519}","Work backwards to a missing side"]],steps:["Picture walking the fence around the shape.","Write down every side length, including the ones you have to figure out.","Add them all. If every side is equal, multiply instead: 8 sides \xD7 3 cm = 24 cm.","If they give you the perimeter and want a missing side, add the sides you know and subtract from the total."]},measure:{goals:[["\u23F0","Add and subtract time"],["\u{1F964}","Pick liquid or weight units"],["\u{1F4D0}","Match the unit to the size"]],steps:["For time, add whole hours first, then the minutes.","Cross into the next hour carefully: 7:45 plus 15 minutes is 8:00, not 7:60.","For units, first ask: is this liquid I could pour, or weight I could hold?","Then ask: is the thing small or big? Milliliters for small liquid, liters for big. Ounces for small weight, pounds for big."]},graphs:{goals:[["\u{1F4CA}","Read a graph without getting tricked"],["\u{1F511}","Use the key and the scale"],["\u{1F50D}","Check data against the picture"]],steps:["Before anything else, find the scale or the key. Look at it twice.","Figure out what one step or one picture is worth.","Count in that amount, not by ones.","To check a dot plot, cross off each number in the list as you count it."]},money:{goals:[["\u{1F4B5}","Count coins and bills"],["\u{1F4BC}","Connect work to income"],["\u{1F3E6}","Tell saving apart from borrowing"]],steps:["Sort coins biggest to smallest: quarters, dimes, nickels, pennies.","Count on from the biggest pile instead of starting over.","For word problems, ask which one it is: earning, spending, saving, or borrowing.","Remember: you EARN interest when you save, and you PAY interest when you borrow."]},vocab:{goals:[["\u{1F524}","Figure out a word you've never seen"],["\u{1F9F1}","Use word parts to unlock meaning"],["\u{1F46F}","Spot homophones and synonyms"]],steps:["Read the whole sentence, then the sentence before and after it.","Look for a clue: a definition, an example, or an opposite nearby.","Check the word for parts. Chop off any prefix or suffix and look at what's left.","Put your guess back into the sentence. Does it still make sense?"]},infer:{goals:[["\u{1F50D}","Make a smart guess from clues"],["\u{1F4CC}","Point to the proof"],["\u{1F4A1}","Find the lesson of a story"]],steps:["Notice what the character DOES, not just what they say.","Add what you already know about people to those clues. That's your inference.","Pick your answer, then go back and find the exact sentence that proves it.","If you can't point at a line, try another answer choice."]},infotext:{goals:[["\u{1F4F0}","Tell teaching apart from convincing"],["\u{1F3AF}","Find the central idea or claim"],["\u2696\uFE0F","Separate fact from opinion"]],steps:["Ask: is this author teaching me facts, or trying to change my mind?","For central idea, check that your answer covers the WHOLE passage, not one paragraph.","For a claim, look at the first and last paragraphs. That's where authors put what they want.","Fact or opinion: watch for should, best, worst, and I think. Those signal opinion."]},craft:{goals:[["\u{1F3AD}","Find why the author wrote it"],["\u{1F5BC}\uFE0F","Notice word choices that make pictures"],["\u{1F441}\uFE0F","Spot who's telling the story"]],steps:["Ask what the author wanted you to do after reading: learn, believe, or enjoy.","For figurative language, ask if it could really happen. If not, it's doing a picture job.","Like or as means simile. Wild exaggeration means hyperbole. Sound word means onomatopoeia.","For point of view, look at the pronouns. 'I' is first person, 'he' or 'she' is third."]},grammar:{goals:[["\u{1F527}","Fix sentences that sound wrong"],["\u{1F91D}","Match subjects and verbs"],["\u2757","Put punctuation where it works"]],steps:["Read the sentence out loud in your head. Your ear catches a lot.","Check the subject: one thing or more than one? Make the verb match.","Check time words like yesterday or tomorrow, and make every verb match that time.","Check if two complete sentences got joined. If so, a comma goes before and, but, or so."]},revise:{goals:[["\u2728","Make good writing better"],["\u{1F9F9}","Cut what doesn't belong"],["\u{1F3C1}","Write a strong ending"]],steps:["Editing fixes mistakes. Revising makes it clearer. Know which one is being asked.","Find the main idea of the paragraph, then check every sentence against it.","If a sentence wanders off topic, cut it \u2014 even if it's a nice sentence.","For a conclusion, restate what you want and give your best reason one last time."]}},qv={placevalue:[{type:"mc",prompt:"Which number has a 5 worth 500?",options:["5,062","1,504","9,035","6,850"],a:1,hint:"Find the 5 in each number and name the spot it sits in.",exp:"In 1,504 the 5 is in the hundreds spot, so it's worth 500. In 5,062 the 5 is worth 5,000, and in 6,850 it's worth 50."},{type:"entry",prompt:"Write the number for: 7 thousands, 2 hundreds, 0 tens, 5 ones.",a:7205,hint:"Every spot needs a digit, even the empty one.",exp:"7,205. The zero holds the tens spot open. Leaving it out would give 725, which is ten times too small."}],compare:[{type:"mc",prompt:"Round 4,682 to the nearest hundred.",options:["4,600","4,700","5,000","4,680"],a:1,hint:"Which hundred is it between, and which is it closer to?",exp:"4,682 sits between 4,600 and 4,700. The 82 pushes it past halfway, so it rounds up to 4,700."},{type:"multi",prompt:"Which numbers are GREATER than 6,540? Select TWO.",options:["6,405","6,543","6,504","7,001","6,450"],a:[1,3],pick:2,hint:"Compare from the left. Don't be fooled by digits in a different order.",exp:"6,543 beats 6,540 in the ones spot, and 7,001 wins at the thousands. The others just shuffle the same digits into smaller numbers."}],fractions:[{type:"shade",prompt:"Shade the model to show 5/6.",parts:6,a:5,hint:"Six equal parts total. Color five of them.",exp:"The whole is cut into 6 pieces, so each is 1/6. Five shaded makes 5/6 \u2014 just one piece short of the whole."},{type:"mc",prompt:"Which fraction is [[equivalent]] to 1/2?",options:["2/3","3/6","1/4","2/8"],a:1,hint:"Half means the top number is exactly half of the bottom.",exp:"3 is half of 6, so 3/6 is the same amount as 1/2. In 2/8, the 2 is only a quarter of 8."}],addsub:[{type:"entry",prompt:"A store had 812 stickers and sold 347. How many are left?",a:465,hint:"Sold means they're gone. Take them away.",exp:"812 \u2212 347 = 465 stickers left."},{type:"mc",prompt:"Leo had 240 marbles. He gave away 85, then found 130 more. How many now?",options:["455","285","155","195"],a:1,hint:"Two steps. Do them in the order the story tells them.",exp:"240 \u2212 85 = 155. Then 155 + 130 = 285. Doing only one of the steps gives the trap answers."}],mult:[{type:"entry",prompt:"There are 8 rows of chairs with 7 chairs in each row. How many chairs?",a:56,hint:"Rows times chairs per row.",exp:"8 \xD7 7 = 56 chairs. This is an [[array]] \u2014 the same fact works whether you count rows first or columns first."},{type:"place",prompt:"Match each expression to what it means.",tiles:["4 \xD7 6","6 \xD7 4","4 + 6"],slots:[{lab:"Four groups of six",a:"4 \xD7 6"},{lab:"Six groups of four",a:"6 \xD7 4"},{lab:"Four and six combined",a:"4 + 6"}],hint:"The first number tells you how many groups there are.",exp:"4 \xD7 6 and 6 \xD7 4 both equal 24, but they describe different pictures. Adding is a completely different action."}],div:[{type:"entry",prompt:"48 pencils are shared equally among 8 students. How many does each get?",a:6,hint:"Eight times what equals forty-eight?",exp:"48 \xF7 8 = 6 pencils each. Check it: 8 \xD7 6 = 48. \u2713"},{type:"inline",prompt:"Complete the sentence about 35 \xF7 5.",sentence:["This is the same as asking 5 times ",0," equals ",1,"."],blanks:[{choices:["5","7","35"],a:1},{choices:["7","35","40"],a:1}],hint:"Turn the division into a multiplication question.",exp:"35 \xF7 5 asks 'five times what makes 35?' The answer is 7, because 5 \xD7 7 = 35."}],tables:[{type:"entry",prompt:"The rule is 'times 6'. Input 9. What is the output?",a:54,hint:"Apply the rule to 9.",exp:"9 \xD7 6 = 54."},{type:"mc",prompt:"A table shows 1 \u2192 7, 2 \u2192 14, 3 \u2192 21. What comes out when 5 goes in?",options:["28","35","12","26"],a:1,hint:"Find the rule first, then use it on 5.",exp:"Each output is the input times 7. So 5 \xD7 7 = 35. Adding 7 to the last row would only work if you filled in 4 first."}],shapes:[{type:"multi",prompt:"Which shapes are always [[quadrilateral]]s? Select TWO.",options:["Triangle","Square","Pentagon","[[Trapezoid]]","Circle"],a:[1,3],pick:2,hint:"Count the straight sides. You need exactly four.",exp:"Squares and trapezoids both have exactly 4 straight sides. Triangles have 3, pentagons have 5, and circles have none."},{type:"mc",prompt:"How many flat [[face]]s does a rectangular [[prism]] have?",options:["4","6","8","12"],a:1,hint:"Think of a cereal box. Count every flat side.",exp:"Six: top, bottom, front, back, and two ends. The 8 is corners and the 12 is edges \u2014 the test offers those on purpose."}],area:[{type:"entry",prompt:"A rug is 7 feet by 6 feet. What is its [[area]] in square feet?",a:42,hint:"Multiply the two side lengths.",exp:"7 \xD7 6 = 42 square feet."},{type:"mc",prompt:"A garden has an area of 24 square meters and is 4 meters wide. How long is it?",options:["6 meters","20 meters","28 meters","96 meters"],a:0,hint:"Four times what equals twenty-four?",exp:"Area is length \xD7 width, so 24 \xF7 4 = 6 meters long. Working backwards from area is a Readiness skill."}],perimeter:[{type:"entry",prompt:"A square has sides of 9 cm. What is its [[perimeter]] in cm?",a:36,hint:"A square has four equal sides.",exp:"4 \xD7 9 = 36 cm."},{type:"mc",prompt:"A rectangle is 8 m long and 3 m wide. Which is its perimeter?",options:["11 m","24 m","22 m","48 m"],a:2,hint:"There are two long sides and two short ones.",exp:"8 + 3 + 8 + 3 = 22 m. The 24 is the AREA \u2014 the test always parks that answer nearby to catch people who grabbed the wrong idea."}],measure:[{type:"mc",prompt:"A soccer game starts at 3:50 and lasts 40 minutes. When does it end?",options:["3:90","4:30","4:10","4:40"],a:1,hint:"Get to the next hour first, then add what's left.",exp:"From 3:50, ten minutes gets you to 4:00. You still have 30 minutes left, so it ends at 4:30. There's no such time as 3:90."},{type:"mc",prompt:  means new, so they're opposites. The other three pairs are all [[synonym]]s."}],infer:[{type:"mc",prompt:"What can you infer about the grandpa at the end?",options:["He is upset the tower was ruined.","He is pleased with how the children handled it.","He did not notice what happened.","He wanted the gold brick himself."],a:1,hint:"What does someone's smile usually mean?",exp:"He smiles into his coffee while watching. Smiling shows approval, so he's pleased \u2014 even though the text never says so directly."},{type:"mc",prompt:"What is the [[conflict]] in this story?",options:["Rosa cannot reach the bin and Milo had already claimed the gold brick.","The grandpa runs out of coffee.","The tower falls over.","Milo forgets to sort the pieces."],a:0,hint:"The conflict is the problem the character has to face.",exp:"The problem is that two people both have a claim on one gold brick. Everything else in the story flows from that."}],infotext:[{type:"mc",prompt:"Which detail from 'Built for Speed' supports the idea that speed has a cost?",options:["A falcon can reach two hundred miles per hour.","A cheetah can only run flat out for about thirty seconds before overheating.","The sailfish has a long pointed bill.","A cheetah reaches full speed in three seconds."],a:1,hint:"Which detail shows something speed TAKES from the animal?",exp:"Overheating after thirty seconds is the price the cheetah pays. The other details show how fast animals are, not what it costs them."},{type:"mc",prompt:"Who is the intended [[audience]] for 'Give Us Back Our Build Time'?",options:["Toy companies","The school's adults who decide the schedule","Kindergarten students","People shopping for shoes"],a:1,hint:"Who has the power to change what the author is asking for?",exp:"The author asks for the schedule to be changed back, so it's written for whoever controls the schedule."}],craft:[{type:"mc",prompt:'"The wind whispered through the tall grass." Why did the author choose whispered?',options:["To s <style>
/* ===== Brick Dash add-on: Sprint Math + Drive Mode ===== */

  border:none;border-radius:999px;padding:12px 18px;color:#fff;cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px;}

  align-items:center;justify-content:center;padding:16px;font-family:'Playpen Sans',ui-rounded,system-ui,sans-serif;}
.bd-overlay.bd-hidden{display:none;}
.bd-card{background:#FFFDF6;border-radius:22px;max-width:480px;width:100%;max-height:92vh;overflow:auto;
  padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.35);color:#0F1F3D;}
.bd-card h1{font-family:'Cherry Cream Soda',ui-rounded,cursive;font-weight:400;font-size:26px;margin:0 0 10px;}
.bd-card h2{font-family:'Cherry Cream Soda',ui-rounded,cursive;font-weight:400;font-size:20px;margin:14px 0 6px;}
.bd-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;}

  font-weight:800;cursor:pointer;color:#0F1F3D;}

.bd-btn{font-family:inherit;font-weight:800;font-size:16px;border:none;border-radius:14px;padding:13px 20px;
  color:#fff;background:#1B62E8;cursor:pointer;box-shadow:0 4px 0 #12428f;}

.bd-btn.ghost{background:#fff;color:#0F1F3D;border:2px solid #CFDAEC;box-shadow:none;}

  padding:6px 14px;}
.bd-problem{text-align:center;margin:26px 0;}
.bd-problem .expr{font-size:44px;font-weight:800;font-family:'Cherry Cream Soda',ui-rounded,cursive;}
.bd-answerbox{display:flex;justify-content:center;margin:14px 0;}
.bd-input{font-size:32px;font-weight:800;text-align:center;width:140px;border:3px solid #CFDAEC;border-radius:14px;
  padding:10px;font-family:inherit;}
.bd-input.ok{border-color:#12A05A;background:#DAF3E6;}
.bd-input.no{border-color:#D8362A;background:#FBE0DE;}

</style>

<div class="bd-fab-wrap">
  <button class="bd-fab sprint" id="bd-open-sprint">🏁 Sprint</button>
</div>

<!-- Sprint modal -->
<div class="bd-overlay bd-hidden" id="bd-sprint-overlay">
  <div class="bd-card bd-cardwrap" id="bd-sprint-card"></div>
</div>

<script>
(function(){
  "use strict";
  var PROGRESS_KEY = "brickdash-progress-v1";

  function loadProgress(){
    try { return JSON.parse(window.localStorage.getItem(PROGRESS_KEY) || "{}") || {}; }
    catch(e){ return {}; }
  }
  function saveProgress(p){
    try { window.localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); } catch(e){}
  }
  var SPRINT_KEY = "brickdash-sprints-v1";
  function loadSprints(){
    try { return JSON.parse(window.localStorage.getItem(SPRINT_KEY) || "{}") || {}; }
    catch(e){ return {}; }
  }
  function saveSprints(s){
    try { window.localStorage.setItem(SPRINT_KEY, JSON.stringify(s)); } catch(e){}
    try { window.dispatchEvent(new Event("brickdash-sprints-updated")); } catch(e){}
  }
  function fmtTime(sec){
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec/60), s = sec%60;
    return m + ":" + String(s).padStart(2,"0");
  }

  /* ============== SPRINT MATH ============== */
  var sprintOverlay = document.getElementById("bd-sprint-overlay");
  var sprintCard = document.getElementById("bd-sprint-card");
  document.getElementById("bd-open-sprint").addEventListener("click", function(){
    sprintOverlay.classList.remove("bd-hidden");
    renderSprintSetup();
  });

  var sprintState = { op:"+", n:7, count:44, target:120 };

  function sprintKey(){ return "sprint_" + (sprintState.op==="+"?"add":sprintState.op==="\u2212"?"sub":"mul") + "_" + sprintState.n + "_" + sprintState.count; }

  function renderSprintSetup(){
    var rec0 = loadSprints()[sprintKey()];
    var best = (rec0 && typeof rec0.bestSec === "number") ? rec0.bestSec : null;
    sprintCard.innerHTML =
      '<button class="bd-close" id="bd-sprint-x">✕</button>' +
      '<h1>🏁 Sprint Math</h1>' +
      '<p style="margin:0 0 10px;color:#5B6B87;">Worksheet-style speed drill \u2014 same idea as a paper timed sprint. Try to beat 2:00!</p>' +
      '<h2>Operation</h2>' +
      '<div class="bd-row" id="bd-op-row"></div>' +
      '<h2>Number</h2>' +
      '<div class="bd-row"><input type="number" min="1" max="12" class="bd-num" id="bd-n-input" value="'+sprintState.n+'"></div>' +
      '<h2>How many problems?</h2>' +
      '<div class="bd-row" id="bd-count-row"></div>' +
      '<p style="color:#5B6B87;margin:6px 0 4px;">'+(best!==null ? ("Best time so far: <b>"+fmtTime(best)+"</b>") : "No runs yet at this setup.")+'</p>' +
      '<div class="bd-row" style="margin-top:16px;"><button class="bd-btn gold" id="bd-sprint-start">Start the clock \u23F1</button></div>';

    document.getElementById("bd-sprint-x").onclick = function(){ sprintOverlay.classList.add("bd-hidden"); };

    var ops = [["+","Add"],["\u2212","Subtract"],["\u00d7","Multiply"]];
    var opRow = document.getElementById("bd-op-row");
    ops.forEach(function(o){
      var b = document.createElement("button");
      b.className = "bd-chip" + (sprintState.op===o[0] ? " on" : "");
      b.textContent = o[0] + " " + o[1];
      b.onclick = function(){ sprintState.op = o[0]; renderSprintSetup(); };
      opRow.appendChild(b);
    });

    var counts = [22,44,60];
    var countRow = document.getElementById("bd-count-row");
    counts.forEach(function(c){
      var b = document.createElement("button");
      b.className = "bd-chip" + (sprintState.count===c ? " on" : "");
      b.textContent = c + " problems";
      b.onclick = function(){ sprintState.count = c; renderSprintSetup(); };
      countRow.appendChild(b);
    });

    document.getElementById("bd-n-input").oninput = function(e){
      var v = parseInt(e.target.value,10);
      if(!isNaN(v) && v>=1 && v<=12) sprintState.n = v;
    };

    document.getElementById("bd-sprint-start").onclick = function(){
      var v = parseInt(document.getElementById("bd-n-input").value,10);
      if(!isNaN(v) && v>=1 && v<=12) sprintState.n = v;
      startSprintRun();
    };
  }

  function genSprintProblems(op, n, count){
    var probs = [];
    for(var i=0;i<count;i++){
      var x = i<8 ? i : Math.floor(Math.random()*90)+10;
      var a,b,ans;
      if(op==="+"){
        if(i%2===0){ a=x; b=n; } else { a=n; b=x; }
        ans = a+b;
      } else if(op==="\u2212"){
        var big = Math.max(x,n), small = Math.min(x,n);
        if(big===small) big = big + n;
        a = big; b = small; ans = a-b;
      } else {
        if(i%2===0){ a=x; b=n; } else { a=n; b=x; }
        ans = a*b;
      }
      probs.push({a:a,b:b,op:op,ans:ans});
    }
    return probs;
  }

  function startSprintRun(){
    var probs = genSprintProblems(sprintState.op, sprintState.n, sprintState.count);
    var idx = 0, correct = 0, startTime = Date.now(), timerId = null, finished = false;

    function render(){
      var elapsed = (Date.now()-startTime)/1000;
      sprintCard.innerHTML =
        '<div class="bd-sprint-top"><span class="bd-progress" style="margin:0;">Problem '+(idx+1)+' of '+probs.length+'</span>' +
        '<span class="bd-timer" id="bd-run-timer">\u23F1 '+fmtTime(elapsed)+'</span></div>' +
        '<div class="bd-problem"><div class="expr">'+probs[idx].a+' '+probs[idx].op+' '+probs[idx].b+' = ?</div></div>' +
        '<div class="bd-answerbox"><input class="bd-input" id="bd-run-input" type="number" autofocus></div>' +
        '<div class="bd-row" style="justify-content:center;"><button class="bd-btn ghost" id="bd-run-stop">Stop</button></div>';

      var input = document.getElementById("bd-run-input");
      input.focus();
      function submit(){
        var v = input.value;
        if(v==="") return;
        var isRight = Number(v) === probs[idx].ans;
        input.classList.add(isRight ? "ok" : "no");
        if(isRight) correct++;
        setTimeout(function(){
          idx++;
          if(idx>=probs.length){ finishSprint(); } else { render(); }
        }, 220);
      }
      input.addEventListener("keydown", function(e){ if(e.key==="Enter") submit(); });
      document.getElementById("bd-run-stop").onclick = function(){ finishSprint(); };
    }

    timerId = setInterval(function(){
      var el = document.getElementById("bd-run-timer");
      if(el && !finished) el.textContent = "\u23F1 " + fmtTime((Date.now()-startTime)/1000);
    }, 500);

    function finishSprint(){
      finished = true;
      clearInterval(timerId);
      var totalSec = (Date.now()-startTime)/1000;
      var store = loadSprints();
      var key = sprintKey();
      var rec = store[key] || {};
      var completed = idx >= probs.length;
      var pct = Math.round((correct / probs.length) * 100);
      var qualifies = completed && pct >= 80;
      var isRecord = qualifies && (typeof rec.bestSec !== "number" || totalSec < rec.bestSec);
      rec.op = sprintState.op; rec.n = sprintState.n; rec.count = probs.length;
      rec.runs = (rec.runs || 0) + 1;
      if(completed){ rec.lastSec = totalSec; rec.lastCorrect = correct; }
      if(isRecord){ rec.bestSec = totalSec; rec.bestCorrect = correct; rec.ts = Date.now(); }
      store[key] = rec;
      saveSprints(store);
      var underTarget = qualifies && totalSec <= sprintState.target;
      var note = !completed ? "Finish every problem to set a best time."
        : pct < 80 ? "Get 80% or more right to count as a best time."
        : underTarget ? "Under 2:00 \u2014 that's a sprint!"
        : "Goal: under 2:00. Keep practicing to speed up.";
      sprintCard.innerHTML =
        '<div class="bd-results">' +
        '<div class="big">'+(underTarget?"\ud83c\udfc1":"\u26a1")+'</div>' +
        '<h1>'+fmtTime(totalSec)+'</h1>' +
        '<p style="color:#5B6B87;">'+correct+' of '+probs.length+' correct'+(isRecord?' \u2014 <b>new best time!</b>':'')+'</p>' +
        '<p style="color:#5B6B87;">'+note+'</p>' +
        '<div class="bd-row" style="justify-content:center;margin-top:14px;">' +
        '<button class="bd-btn gold" id="bd-run-again">Run it again</button>' +
        '<button class="bd-btn ghost" id="bd-run-settings">Change settings</button>' +
        '<button class="bd-btn ghost" id="bd-run-close">Close</button>' +
        '</div></div>';
      document.getElementById("bd-run-again").onclick = startSprintRun;
      document.getElementById("bd-run-settings").onclick = renderSprintSetup;
      document.getElementById("bd-run-close").onclick = function(){ sprintOverlay.classList.add("bd-hidden"); };
    }

    render();
  }

})();
</script>
