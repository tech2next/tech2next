. Take them away.",exp:"812 \u2212 347 = 465 stickers left."},{type:"mc",prompt:"Leo had 240 marbles. He gave away 85, then found 130 more. How many now?",options:["455","285","155","195"],a:1,hint:"Two steps. Do them in the order the story tells them.",exp:"240 \u2212 85 = 155. Then 155 + 130 = 285. Doing only one of the steps gives the trap answers."}],mult:[{type:"entry",prompt:"There are 8 rows of chairs with 7 chairs in each row. How many chairs?",a:56,hint:"Rows times chairs per row.",exp:"8 \xD7 7 = 56 chairs. This is an [[array]] \u2014 the same fact works whether you count rows first or columns first."},{type:"place",prompt:"Match each expression to what it means.",tiles:["4 \xD7 6","6 \xD7 4","4 + 6"],slots:[{lab:"Four groups of six",a:"4 \xD7 6"},{lab:"Six groups of four",a:"6 \xD7 4"},{lab:"Four and six combined",a:"4 + 6"}],hint:"The first number tells you how many groups there are.",exp:"4 \xD7 6 and 6 \xD7 4 both equal 24, but they describe different pictures. Adding is a completely different action."}],div:[{type:"entry",prompt:"48 pencils are shared equally among 8 students. How many does each get?",a:6,hint:"Eight times what equals forty-eight?",exp:"48 \xF7 8 = 6 pencils each. Check it: 8 \xD7 6 = 48. \u2713"},{type:"inline",prompt:"Complete the sentence about 35 \xF7 5.",sentence:["This is the same as asking 5 times ",0," equals ",1,"."],blanks:[{choices:["5","7","35"],a:1},{choices:["7","35","40"],a:1}],hint:"Turn the division into a multiplication question.",exp:"35 \xF7 5 asks 'five times what makes 35?' The answer is 7, because 5 \xD7 7 = 35."}],tables:[{type:"entry",prompt:"The rule is 'times 6'. Input 9. What is the output?",a:54,hint:"Apply the rule to 9.",exp:"9 \xD7 6 = 54."},{type:"mc",prompt:"A table shows 1 \u2192 7, 2 \u2192 14, 3 \u2192 21. What comes out when 5 goes in?",options:["28","35","12","26"],a:1,hint:"Find the rule first, then use it on 5.",exp:"Each output is the input times 7. So 5 \xD7 7 = 35. Adding 7 to the last row w <style>
/* ===== Brick Dash add-on: Sprint Math + Drive Mode ===== */
.bd-fab-wrap{position:fixed;right:16px;bottom:18px;z-index:9000;display:flex;flex-direction:column;gap:10px;align-items:flex-end;}
.bd-fab{font-family:'Playpen Sans',ui-rounded,system-ui,sans-serif;font-weight:800;font-size:15px;
  border:none;border-radius:999px;padding:12px 18px;color:#fff;cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px;}
.bd-fab:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18);}
.bd-fab.sprint{background:#D8362A;}
.bd-fab.drive{background:#1B62E8;}
.bd-overlay{position:fixed;inset:0;background:rgba(15,31,61,.72);z-index:9500;display:flex;
  align-items:center;justify-content:center;padding:16px;font-family:'Playpen Sans',ui-rounded,system-ui,sans-serif;}
.bd-overlay.bd-hidden{display:none;}
.bd-card{background:#FFFDF6;border-radius:22px;max-width:480px;width:100%;max-height:92vh;overflow:auto;
  padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.35);color:#0F1F3D;}
.bd-card h1{font-family:'Cherry Cream Soda',ui-rounded,cursive;font-weight:400;font-size:26px;margin:0 0 10px;}
.bd-card h2{font-family:'Cherry Cream Soda',ui-rounded,cursive;font-weight:400;font-size:20px;margin:14px 0 6px;}
.bd-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;}
.bd-chip{border:2px solid #CFDAEC;background:#fff;border-radius:12px;padding:10px 16px;font-size:16px;
  font-weight:800;cursor:pointer;color:#0F1F3D;}
.bd-chip.on{border-color:#1B62E8;background:#DCE7FD;}
.bd-num{width:64px;text-align:center;font-size:20px;font-weight:800;border:2px solid #CFDAEC;border-radius:10px;padding:8px;}
.bd-btn{font-family:inherit;font-weight:800;font-size:16px;border:none;border-radius:14px;padding:13px 20px;
  color:#fff;background:#1B62E8;cursor:pointer;box-shadow:0 4px 0 #12428f;}
.bd-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #12428f;}
.bd-btn.ghost{background:#fff;color:#0F1F3D;border:2px solid #CFDAEC;box-shadow:none;}
.bd-btn.gold{background:#F5C518;color:#0F1F3D;box-shadow:0 4px 0 #c79c0d;}
.bd-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:22px;cursor:pointer;color:#5B6B87;}
.bd-cardwrap{position:relative;}
.bd-sprint-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.bd-timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px;background:#DCE7FD;border-radius:999px;
  padding:6px 14px;}
.bd-problem{text-align:center;margin:26px 0;}
.bd-problem .expr{font-size:44px;font-weight:800;font-family:'Cherry Cream Soda',ui-rounded,cursive;}
.bd-answerbox{display:flex;justify-content:center;margin:14px 0;}
.bd-input{font-size:32px;font-weight:800;text-align:center;width:140px;border:3px solid #CFDAEC;border-radius:14px;
  padding:10px;font-family:inherit;}
.bd-input.ok{border-color:#12A05A;background:#DAF3E6;}
.bd-input.no{border-color:#D8362A;background:#FBE0DE;}
.bd-progress{text-align:center;font-weight:800;color:#5B6B87;margin-bottom:4px;}
.bd-results{text-align:center;}
.bd-results .big{font-size:40px;}
</style>

<div class="bd-fab-wrap">
  <button class="bd-fab sprint" id="bd-open-sprint">🏁 Sprint</button>
</div>

<!-- Sprint modal -->
<div class="bd-overlay bd-hidden" id="bd-sprint-overlay">
  <div class="bd-card bd-cardwrap" id="bd-sprint-card"></div>
</div>

<script>
(function(){
  "use strict";
  var PROGRESS_KEY = "brickdash-progress-v1";

  function loadProgress(){
    try { return JSON.parse(window.localStorage.getItem(PROGRESS_KEY) || "{}") || {}; }
    catch(e){ return {}; }
  }
  function saveProgress(p){
    try { window.localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); } catch(e){}
  }
  var SPRINT_KEY = "brickdash-sprints-v1";
  function loadSprints(){
    try { return JSON.parse(window.localStorage.getItem(SPRINT_KEY) || "{}") || {}; }
    catch(e){ return {}; }
  }
  function saveSprints(s){
    try { window.localStorage.setItem(SPRINT_KEY, JSON.stringify(s)); } catch(e){}
    try { window.dispatchEvent(new Event("brickdash-sprints-updated")); } catch(e){}
  }
  function fmtTime(sec){
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec/60), s = sec%60;
    return m + ":" + String(s).padStart(2,"0");
  }

  /* ============== SPRINT MATH ============== */
  var sprintOverlay = document.getElementById("bd-sprint-overlay");
  var sprintCard = document.getElementById("bd-sprint-card");
  document.getElementById("bd-open-sprint").addEventListener("click", function(){
    sprintOverlay.classList.remove("bd-hidden");
    renderSprintSetup();
  });

  var sprintState = { op:"+", n:7, count:44, target:120 };

  function sprintKey(){ return "sprint_" + (sprintState.op==="+"?"add":sprintState.op==="\u2212"?"sub":"mul") + "_" + sprintState.n + "_" + sprintState.count; }

  function renderSprintSetup(){
    var rec0 = loadSprints()[sprintKey()];
    var best = (rec0 && typeof rec0.bestSec === "number") ? rec0.bestSec : null;
    sprintCard.innerHTML =
      '<button class="bd-close" id="bd-sprint-x">✕</button>' +
      '<h1>🏁 Sprint Math</h1>' +
      '<p style="margin:0 0 10px;color:#5B6B87;">Worksheet-style speed drill \u2014 same idea as a paper timed sprint. Try to beat 2:00!</p>' +
      '<h2>Operation</h2>' +
      '<div class="bd-row" id="bd-op-row"></div>' +
      '<h2>Number</h2>' +
      '<div class="bd-row"><input type="number" min="1" max="12" class="bd-num" id="bd-n-input" value="'+sprintState.n+'"></div>' +
      '<h2>How many problems?</h2>' +
      '<div class="bd-row" id="bd-count-row"></div>' +
      '<p style="color:#5B6B87;margin:6px 0 4px;">'+(best!==null ? ("Best time so far: <b>"+fmtTime(best)+"</b>") : "No runs yet at this setup.")+'</p>' +
      '<div class="bd-row" style="margin-top:16px;"><button class="bd-btn gold" id="bd-sprint-start">Start the clock \u23F1</button></div>';

    document.getElementById("bd-sprint-x").onclick = function(){ sprintOverlay.classList.add("bd-hidden"); };

    var ops = [["+","Add"],["\u2212","Subtract"],["\u00d7","Multiply"]];
    var opRow = document.getElementById("bd-op-row");
    ops.forEach(function(o){
      var b = document.createElement("button");
      b.className = "bd-chip" + (sprintState.op===o[0] ? " on" : "");
      b.textContent = o[0] + " " + o[1];
      b.onclick = function(){ sprintState.op = o[0]; renderSprintSetup(); };
      opRow.appendChild(b);
    });

    var counts = [22,44,60];
    var countRow = document.getElementById("bd-count-row");
    counts.forEach(function(c){
      var b = document.createElement("button");
      b.className = "bd-chip" + (sprintState.count===c ? " on" : "");
      b.textContent = c + " problems";
      b.onclick = function(){ sprintState.count = c; renderSprintSetup(); };
      countRow.appendChild(b);
    });

    document.getElementById("bd-n-input").oninput = function(e){
      var v = parseInt(e.target.value,10);
      if(!isNaN(v) && v>=1 && v<=12) sprintState.n = v;
    };

    document.getElementById("bd-sprint-start").onclick = function(){
      var v = parseInt(document.getElementById("bd-n-input").value,10);
      if(!isNaN(v) && v>=1 && v<=12) sprintState.n = v;
      startSprintRun();
    };
  }

  function genSprintProblems(op, n, count){
    var probs = [];
    for(var i=0;i<count;i++){
      var x = i<8 ? i : Math.floor(Math.random()*90)+10;
      var a,b,ans;
      if(op==="+"){
        if(i%2===0){ a=x; b=n; } else { a=n; b=x; }
        ans = a+b;
      } else if(op==="\u2212"){
        var big = Math.max(x,n), small = Math.min(x,n);
        if(big===small) big = big + n;
        a = big; b = small; ans = a-b;
      } else {
        if(i%2===0){ a=x; b=n; } else { a=n; b=x; }
        ans = a*b;
      }
      probs.push({a:a,b:b,op:op,ans:ans});
    }
    return probs;
  }

  function startSprintRun(){
    var probs = genSprintProblems(sprintState.op, sprintState.n, sprintState.count);
    var idx = 0, correct = 0, startTime = Date.now(), timerId = null, finished = false;

    function render(){
      var elapsed = (Date.now()-startTime)/1000;
      sprintCard.innerHTML =
        '<div class="bd-sprint-top"><span class="bd-progress" style="margin:0;">Problem '+(idx+1)+' of '+probs.length+'</span>' +
        '<span class="bd-timer" id="bd-run-timer">\u23F1 '+fmtTime(elapsed)+'</span></div>' +
        '<div class="bd-problem"><div class="expr">'+probs[idx].a+' '+probs[idx].op+' '+probs[idx].b+' = ?</div></div>' +
        '<div class="bd-answerbox"><input class="bd-input" id="bd-run-input" type="number" autofocus></div>' +
        '<div class="bd-row" style="justify-content:center;"><button class="bd-btn ghost" id="bd-run-stop">Stop</button></div>';

      var input = document.getElementById("bd-run-input");
      input.focus();
      function submit(){
        var v = input.value;
        if(v==="") return;
        var isRight = Number(v) === probs[idx].ans;
        input.classList.add(isRight ? "ok" : "no");
        if(isRight) correct++;
        setTimeout(function(){
          idx++;
          if(idx>=probs.length){ finishSprint(); } else { render(); }
        }, 220);
      }
      input.addEventListener("keydown", function(e){ if(e.key==="Enter") submit(); });
      document.getElementById("bd-run-stop").onclick = function(){ finishSprint(); };
    }

    timerId = setInterval(function(){
      var el = document.getElementById("bd-run-timer");
      if(el && !finished) el.textContent = "\u23F1 " + fmtTime((Date.now()-startTime)/1000);
    }, 500);

    function finishSprint(){
      finished = true;
      clearInterval(timerId);
      var totalSec = (Date.now()-startTime)/1000;
      var store = loadSprints();
      var key = sprintKey();
      var rec = store[key] || {};
      var completed = idx >= probs.length;
      var pct = Math.round((correct / probs.length) * 100);
      var qualifies = completed && pct >= 80;
      var isRecord = qualifies && (typeof rec.bestSec !== "number" || totalSec < rec.bestSec);
      rec.op = sprintState.op; rec.n = sprintState.n; rec.count = probs.length;
      rec.runs = (rec.runs || 0) + 1;
      if(completed){ rec.lastSec = totalSec; rec.lastCorrect = correct; }
      if(isRecord){ rec.bestSec = totalSec; rec.bestCorrect = correct; rec.ts = Date.now(); }
      store[key] = rec;
      saveSprints(store);
      var underTarget = qualifies && totalSec <= sprintState.target;
      var note = !completed ? "Finish every problem to set a best time."
        : pct < 80 ? "Get 80% or more right to count as a best time."
        : underTarget ? "Under 2:00 \u2014 that's a sprint!"
        : "Goal: under 2:00. Keep practicing to speed up.";
      sprintCard.innerHTML =
        '<div class="bd-results">' +
        '<div class="big">'+(underTarget?"\ud83c\udfc1":"\u26a1")+'</div>' +
        '<h1>'+fmtTime(totalSec)+'</h1>' +
        '<p style="color:#5B6B87;">'+correct+' of '+probs.length+' correct'+(isRecord?' \u2014 <b>new best time!</b>':'')+'</p>' +
        '<p style="color:#5B6B87;">'+note+'</p>' +
        '<div class="bd-row" style="justify-content:center;margin-top:14px;">' +
        '<button class="bd-btn gold" id="bd-run-again">Run it again</button>' +
        '<button class="bd-btn ghost" id="bd-run-settings">Change settings</button>' +
        '<button class="bd-btn ghost" id="bd-run-close">Close</button>' +
        '</div></div>';
      document.getElementById("bd-run-again").onclick = startSprintRun;
      document.getElementById("bd-run-settings").onclick = renderSprintSetup;
      document.getElementById("bd-run-close").onclick = function(){ sprintOverlay.classList.add("bd-hidden"); };
    }

    render();
  }

})();
</script>

</body>
</html>
